# Photos plugin conformance gate.
# Runs sdktest golden vectors against the SDK contract on every push, pull
# request and tagged release. The SDK resolves from the tagged go.mod
# requirement unless a manual run supplies an sdk_ref override.
name: conformance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '37 7 * * 4'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'plugin-sdk ref to test against'
        required: false
        type: string

jobs:
  fast-conformance:
    name: fast conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-photos
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-photos/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-photos
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: gofmt
        working-directory: beamfall-plugin-photos
        run: gofmt -l . | tee /dev/stderr | (! grep -q .)
      - name: vet
        working-directory: beamfall-plugin-photos
        run: go vet ./...
      - name: conformance and per-package coverage
        working-directory: beamfall-plugin-photos
        run: python3 .github/workflows/test_depth_gate.py check
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.15.0
          working-directory: beamfall-plugin-photos

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-photos
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-photos/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-photos
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: race
        working-directory: beamfall-plugin-photos
        run: go test -race -count=1 ./...

  conformance:
    name: conformance
    needs: [fast-conformance, race]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fast and race jobs
        env:
          FAST_RESULT: ${{ needs.fast-conformance.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$RACE_RESULT" = success

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        target:
          - FuzzReadEXIF
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-photos
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-photos/go.mod
      - name: Bounded EXIF fuzz
        working-directory: beamfall-plugin-photos
        env:
          FUZZ_TIME: 20s
        run: script/gate.sh fuzz
